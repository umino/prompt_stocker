<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="画像生成プロンプトをスマートに管理。タグ検索・グリッド/リスト表示切替・インポート/エクスポート対応。">
    <title>Prompt Stocker — 画像生成プロンプト管理</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <!-- ── Header ── -->
        <div class="header-section">
            <h1>Prompt Stocker</h1>
            <div class="header-actions">
                <button id="save-btn" class="save-btn" style="display:none;" title="変更を保存" aria-label="変更を保存">保存</button>
                <button id="settings-btn" class="settings-btn" title="設定" aria-label="設定を開く">⚙</button>
            </div>
        </div>

        <!-- ── 入力フォーム ── -->
        <section class="form-section" aria-label="プロンプト入力">
            <h2>新規追加 / 編集</h2>
            <form id="prompt-form" novalidate>
                <!-- 名前 -->
                <div class="form-group">
                    <label for="name">
                        <span class="label-text">名前</span>
                        <span class="input-hint">必須・80文字以内</span>
                    </label>
                    <input type="text" id="name" required maxlength="80" placeholder="プロンプト名">
                </div>

                <!-- コメント -->
                <div class="form-group">
                    <label for="comment">
                        <span class="label-text">コメント</span>
                        <span class="input-hint">任意・200文字以内</span>
                    </label>
                    <input type="text" id="comment" maxlength="200" placeholder="用途など">
                </div>

                <!-- タグ -->
                <div class="form-group">
                    <label for="tags">
                        <span class="label-text">タグ</span>
                        <span class="input-hint">カンマ区切り</span>
                    </label>
                    <input type="text" id="tags" placeholder="portrait, anime, lighting">
                </div>

                <!-- プロンプト -->
                <div class="form-group prompt-group">
                    <label for="prompt">
                        <span class="label-text">プロンプト</span>
                        <span class="input-hint">必須・4000文字以内</span>
                    </label>
                    <textarea id="prompt" required maxlength="4000" placeholder="masterpiece, best quality, ..."></textarea>
                </div>

                <!-- ボタン類 -->
                <button type="submit" id="submit-btn">追加</button>
                <button type="button" id="cancel-btn" style="display:none;">キャンセル</button>
            </form>
        </section>

        <!-- ── 一覧セクション ── -->
        <section class="list-section" aria-label="プロンプト一覧">
            <!-- 一覧ヘッダー -->
            <div class="list-header">
                <div class="list-header-left">
                    <h2>一覧 <span id="count-badge" class="count-badge">0</span></h2>
                    <div class="search-container">
                        <input type="text" id="search" placeholder="🔍  名前・タグで検索" autocomplete="off">
                        <button id="clear-search" class="clear-search-btn" title="検索をクリア" aria-label="検索をクリア">✕</button>
                    </div>
                </div>
                <div class="mode-controls">
                    <select id="sort-order" class="sort-select" title="並び替え" aria-label="並び替え">
                        <option value="updated_desc">更新が新しい順</option>
                        <option value="created_desc">追加が新しい順</option>
                        <option value="created_asc">追加が古い順</option>
                        <option value="name_asc">名前順</option>
                    </select>
                    <button id="bulk-copy-btn" class="bulk-copy-btn" title="フィルタ中のプロンプトを全件コピー（1行1件）" aria-label="一括コピー">
                        <span class="bulk-copy-icon">⎘</span>
                        <span class="bulk-copy-label">一括コピー</span>
                    </button>
                    <button id="grid-mode-btn" class="mode-btn active" title="カード表示" aria-label="カード表示">⊞</button>
                    <button id="list-mode-btn" class="mode-btn" title="リスト表示" aria-label="リスト表示">☰</button>
                </div>
            </div>

            <!-- スクロール可能エリア -->
            <div class="prompt-list-container">
                <div id="prompt-list" class="prompt-list"></div>
            </div>
        </section>
    </div>

    <!-- ── 設定モーダル ── -->
    <div id="settings-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">⚙ 設定</h3>
                <button id="close-modal" class="close-btn" aria-label="閉じる">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-group">
                    <h4>データ管理</h4>
                    <button id="export-btn" class="modal-btn">📤 データをエクスポート (.json)</button>
                    <button id="import-btn" class="modal-btn">📥 データをインポート (.json)</button>
                    <input type="file" id="import-file" accept=".json" style="display:none;">
                </div>
                <div class="settings-group" id="file-link-group">
                    <h4>ファイル連携（自動保存）</h4>
                    <p id="file-link-status" class="file-link-status">未連携</p>
                    <button id="file-link-btn" class="modal-btn">📁 ファイルと連携する</button>
                    <button id="file-unlink-btn" class="modal-btn" style="display:none;">🔌 連携を解除</button>
                    <p class="file-link-note">連携すると、変更のたびに選択した JSON ファイルへ自動保存します。ファイルをコピーすればバックアップになります。</p>
                </div>
                <div class="settings-group">
                    <h4>表示設定</h4>
                    <label class="checkbox-label">
                        <input type="checkbox" id="auto-save" checked>
                        <span class="checkmark"></span>
                        自動保存を有効にする
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- ── トースト通知 ── -->
    <div id="toast" class="toast" role="status" aria-live="polite">
        <div class="toast-content">
            <span class="toast-message"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
